<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380">
  <!-- Fondo -->
  <rect width="600" height="380" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/>
  
  <!-- Título -->
  <text x="300" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#495057">
    Plano de Ubicación del Proyecto
  </text>
  
  <!-- Plano simulado -->
  <g transform="translate(150, 60)">
    <rect width="300" height="180" fill="#ffffff" stroke="#28a745" stroke-width="3" rx="8"/>
    
    <!-- Calles -->
    <line x1="20" y1="60" x2="280" y2="60" stroke="#adb5bd" stroke-width="2"/>
    <line x1="20" y1="120" x2="280" y2="120" stroke="#adb5bd" stroke-width="2"/>
    <line x1="100" y1="20" x2="100" y2="160" stroke="#adb5bd" stroke-width="2"/>
    <line x1="200" y1="20" x2="200" y2="160" stroke="#adb5bd" stroke-width="2"/>
    
    <!-- Lote destacado (proyecto) -->
    <rect x="105" y="65" width="90" height="50" fill="#d4edda" stroke="#28a745" stroke-width="2" rx="3"/>
    <text x="150" y="93" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#155724">
      LOTE
    </text>
    <text x="150" y="108" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#155724">
      (PROYECTO)
    </text>
    
    <!-- Otros lotes -->
    <rect x="25" y="25" width="70" height="30" fill="#e9ecef" stroke="#6c757d" stroke-width="1"/>
    <rect x="205" y="25" width="70" height="30" fill="#e9ecef" stroke="#6c757d" stroke-width="1"/>
    <rect x="25" y="125" width="70" height="30" fill="#e9ecef" stroke="#6c757d" stroke-width="1"/>
    <rect x="205" y="125" width="70" height="30" fill="#e9ecef" stroke="#6c757d" stroke-width="1"/>
    
    <!-- Nombres de calles -->
    <text x="150" y="50" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#495057" font-style="italic">
      Calle Principal
    </text>
    <text x="150" y="145" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#495057" font-style="italic">
      Calle Secundaria
    </text>
    
    <!-- Rosa de los vientos -->
    <g transform="translate(260, 165)">
      <circle cx="0" cy="0" r="12" fill="none" stroke="#6c757d" stroke-width="1"/>
      <line x1="0" y1="-12" x2="0" y2="12" stroke="#6c757d" stroke-width="1"/>
      <line x1="-12" y1="0" x2="12" y2="0" stroke="#6c757d" stroke-width="1"/>
      <polygon points="0,-12 -3,-6 3,-6" fill="#6c757d"/>
      <text x="0" y="-18" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#495057">N</text>
    </g>
  </g>
  
  <!-- Instrucciones -->
  <g transform="translate(0, 260)">
    <text x="300" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#212529">
      El plano debe incluir:
    </text>
    
    <g transform="translate(100, 25)">
      <circle cx="0" cy="-3" r="4" fill="#28a745"/>
      <text x="15" y="0" font-family="Arial, sans-serif" font-size="14" fill="#495057">
        Ubicación exacta del proyecto en el lote
      </text>
    </g>
    
    <g transform="translate(100, 50)">
      <circle cx="0" cy="-3" r="4" fill="#28a745"/>
      <text x="15" y="0" font-family="Arial, sans-serif" font-size="14" fill="#495057">
        Calles circundantes y su nomenclatura
      </text>
    </g>
    
    <g transform="translate(100, 75)">
      <circle cx="0" cy="-3" r="4" fill="#28a745"/>
      <text x="15" y="0" font-family="Arial, sans-serif" font-size="14" fill="#495057">
        Referencias de orientación (Norte geográfico)
      </text>
    </g>
    
    <g transform="translate(100, 100)">
      <circle cx="0" cy="-3" r="4" fill="#28a745"/>
      <text x="15" y="0" font-family="Arial, sans-serif" font-size="14" fill="#495057">
        Escala gráfica del plano
      </text>
    </g>
  </g>
</svg>