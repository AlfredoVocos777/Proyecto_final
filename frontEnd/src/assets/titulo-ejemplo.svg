<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380">
  <!-- Fondo -->
  <rect width="600" height="380" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/>
  
  <!-- Título -->
  <text x="300" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#495057">
    Título de Propiedad o Boleto de Compra Venta
  </text>
  
  <!-- Documentos simulados (dos opciones) -->
  <g transform="translate(50, 60)">
    <!-- Título de Propiedad -->
    <rect width="240" height="160" fill="#ffffff" stroke="#dc3545" stroke-width="3" rx="8"/>
    <text x="120" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc3545">
      TÍTULO DE PROPIEDAD
    </text>
    
    <!-- Contenido del título -->
    <g transform="translate(15, 45)">
      <rect x="0" y="0" width="210" height="8" fill="#f8d7da" rx="2"/>
      <text x="105" y="6" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="#721c24">
        ESCRITURA PÚBLICA N°
      </text>
      
      <rect x="0" y="20" width="210" height="6" fill="#e9ecef" rx="2"/>
      <rect x="0" y="29" width="180" height="6" fill="#e9ecef" rx="2"/>
      <rect x="0" y="38" width="195" height="6" fill="#e9ecef" rx="2"/>
      
      <text x="0" y="57" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#495057">
        Titular:
      </text>
      <rect x="0" y="60" width="210" height="5" fill="#e9ecef" rx="1"/>
      
      <text x="0" y="77" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#495057">
        Ubicación:
      </text>
      <rect x="0" y="80" width="210" height="5" fill="#e9ecef" rx="1"/>
      <rect x="0" y="88" width="170" height="5" fill="#e9ecef" rx="1"/>
      
      <text x="0" y="105" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#495057">
        Matrícula/Padrón:
      </text>
      <rect x="0" y="108" width="120" height="5" fill="#e9ecef" rx="1"/>
    </g>
    
    <!-- Sello simulado -->
    <circle cx="200" cy="135" r="18" fill="none" stroke="#dc3545" stroke-width="2" opacity="0.3"/>
    <text x="200" y="135" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="#dc3545" opacity="0.3">
      ESCRIBANÍA
    </text>
  </g>
  
  <g transform="translate(310, 60)">
    <!-- Boleto de Compra Venta -->
    <rect width="240" height="160" fill="#ffffff" stroke="#dc3545" stroke-width="3" rx="8"/>
    <text x="120" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc3545">
      BOLETO DE
    </text>
    <text x="120" y="35" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#dc3545">
      COMPRA VENTA
    </text>
    
    <!-- Contenido del boleto -->
    <g transform="translate(15, 50)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#495057">
        Vendedor:
      </text>
      <rect x="0" y="3" width="210" height="5" fill="#e9ecef" rx="1"/>
      
      <text x="0" y="20" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#495057">
        Comprador:
      </text>
      <rect x="0" y="23" width="210" height="5" fill="#e9ecef" rx="1"/>
      
      <text x="0" y="40" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#495057">
        Inmueble:
      </text>
      <rect x="0" y="43" width="210" height="5" fill="#e9ecef" rx="1"/>
      <rect x="0" y="51" width="170" height="5" fill="#e9ecef" rx="1"/>
      
      <text x="0" y="68" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#495057">
        Precio:
      </text>
      <rect x="0" y="71" width="120" height="5" fill="#e9ecef" rx="1"/>
      
      <text x="0" y="88" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#495057">
        Fecha:
      </text>
      <rect x="0" y="91" width="90" height="5" fill="#e9ecef" rx="1"/>
    </g>
    
    <!-- Firmas simuladas -->
    <g transform="translate(15, 135)">
      <line x1="0" y1="0" x2="85" y2="0" stroke="#6c757d" stroke-width="1"/>
      <text x="42" y="10" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="#6c757d">
        Firma Vendedor
      </text>
      
      <line x1="125" y1="0" x2="210" y2="0" stroke="#6c757d" stroke-width="1"/>
      <text x="167" y="10" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" fill="#6c757d">
        Firma Comprador
      </text>
    </g>
  </g>
  
  <!-- Texto "O" entre los documentos -->
  <g transform="translate(300, 140)">
    <circle cx="0" cy="0" r="20" fill="#6c757d"/>
    <text x="0" y="6" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">
      O
    </text>
  </g>
  
  <!-- Instrucciones -->
  <g transform="translate(0, 240)">
    <text x="300" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#212529">
      Documentación requerida (una de las dos opciones):
    </text>
    
    <g transform="translate(60, 25)">
      <circle cx="0" cy="-3" r="4" fill="#dc3545"/>
      <text x="15" y="0" font-family="Arial, sans-serif" font-size="14" fill="#495057">
        Título de propiedad: Escritura pública registrada en el Registro de la Propiedad
      </text>
    </g>
    
    <g transform="translate(60, 50)">
      <circle cx="0" cy="-3" r="4" fill="#dc3545"/>
      <text x="15" y="0" font-family="Arial, sans-serif" font-size="14" fill="#495057">
        Boleto de compra venta: Contrato privado firmado por ambas partes (válido temporalmente)
      </text>
    </g>
    
    <g transform="translate(60, 75)">
      <circle cx="0" cy="-3" r="4" fill="#dc3545"/>
      <text x="15" y="0" font-family="Arial, sans-serif" font-size="14" fill="#495057">
        El documento debe estar legible y completo
      </text>
    </g>
    
    <g transform="translate(60, 100)">
      <circle cx="0" cy="-3" r="4" fill="#dc3545"/>
      <text x="15" y="0" font-family="Arial, sans-serif" font-size="14" fill="#495057">
        Verificar que los datos coincidan con la ubicación del proyecto
      </text>
    </g>
  </g>
</svg>