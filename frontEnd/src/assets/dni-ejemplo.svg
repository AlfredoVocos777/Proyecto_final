<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380">
  <!-- Fondo -->
  <rect width="600" height="380" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/>
  
  <!-- Título -->
  <text x="300" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#495057">
    DNI - Frente y Dorso Requeridos
  </text>
  
  <!-- DNI Frente -->
  <g transform="translate(50, 60)">
    <rect width="240" height="150" fill="#ffffff" stroke="#0d6efd" stroke-width="3" rx="8"/>
    <text x="120" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0d6efd">
      FRENTE
    </text>
    
    <!-- Foto simulada -->
    <rect x="15" y="40" width="60" height="75" fill="#e9ecef" stroke="#adb5bd" stroke-width="1" rx="3"/>
    <circle cx="45" cy="65" r="15" fill="#ced4da"/>
    <path d="M 30 85 Q 45 75 60 85" stroke="#ced4da" stroke-width="2" fill="none"/>
    
    <!-- Datos simulados -->
    <rect x="85" y="45" width="140" height="8" fill="#e9ecef" rx="2"/>
    <rect x="85" y="60" width="120" height="8" fill="#e9ecef" rx="2"/>
    <rect x="85" y="75" width="100" height="8" fill="#e9ecef" rx="2"/>
    <rect x="85" y="90" width="130" height="8" fill="#e9ecef" rx="2"/>
    <rect x="85" y="105" width="90" height="8" fill="#e9ecef" rx="2"/>
    
    <!-- Número DNI -->
    <text x="15" y="135" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#212529">
      DNI: XX.XXX.XXX
    </text>
  </g>
  
  <!-- DNI Dorso -->
  <g transform="translate(310, 60)">
    <rect width="240" height="150" fill="#ffffff" stroke="#0d6efd" stroke-width="3" rx="8"/>
    <text x="120" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#0d6efd">
      DORSO
    </text>
    
    <!-- Código de barras simulado -->
    <g transform="translate(40, 45)">
      <rect x="0" y="0" width="3" height="40" fill="#212529"/>
      <rect x="5" y="0" width="2" height="40" fill="#212529"/>
      <rect x="9" y="0" width="4" height="40" fill="#212529"/>
      <rect x="15" y="0" width="2" height="40" fill="#212529"/>
      <rect x="19" y="0" width="5" height="40" fill="#212529"/>
      <rect x="26" y="0" width="3" height="40" fill="#212529"/>
      <rect x="31" y="0" width="2" height="40" fill="#212529"/>
      <rect x="35" y="0" width="4" height="40" fill="#212529"/>
      <rect x="41" y="0" width="2" height="40" fill="#212529"/>
      <rect x="45" y="0" width="3" height="40" fill="#212529"/>
      <rect x="50" y="0" width="5" height="40" fill="#212529"/>
      <rect x="57" y="0" width="2" height="40" fill="#212529"/>
      <rect x="61" y="0" width="4" height="40" fill="#212529"/>
      <rect x="67" y="0" width="3" height="40" fill="#212529"/>
      <rect x="72" y="0" width="2" height="40" fill="#212529"/>
      <rect x="76" y="0" width="5" height="40" fill="#212529"/>
      <rect x="83" y="0" width="3" height="40" fill="#212529"/>
      <rect x="88" y="0" width="2" height="40" fill="#212529"/>
      <rect x="92" y="0" width="4" height="40" fill="#212529"/>
      <rect x="98" y="0" width="2" height="40" fill="#212529"/>
      <rect x="102" y="0" width="3" height="40" fill="#212529"/>
      <rect x="107" y="0" width="5" height="40" fill="#212529"/>
      <rect x="114" y="0" width="2" height="40" fill="#212529"/>
      <rect x="118" y="0" width="4" height="40" fill="#212529"/>
      <rect x="124" y="0" width="3" height="40" fill="#212529"/>
      <rect x="129" y="0" width="2" height="40" fill="#212529"/>
      <rect x="133" y="0" width="5" height="40" fill="#212529"/>
      <rect x="140" y="0" width="3" height="40" fill="#212529"/>
      <rect x="145" y="0" width="2" height="40" fill="#212529"/>
      <rect x="149" y="0" width="4" height="40" fill="#212529"/>
      <rect x="155" y="0" width="2" height="40" fill="#212529"/>
      <rect x="159" y="0" width="3" height="40" fill="#212529"/>
    </g>
    
    <!-- Datos adicionales simulados -->
    <rect x="15" y="95" width="210" height="6" fill="#e9ecef" rx="2"/>
    <rect x="15" y="107" width="180" height="6" fill="#e9ecef" rx="2"/>
    <rect x="15" y="119" width="160" height="6" fill="#e9ecef" rx="2"/>
    <rect x="15" y="131" width="190" height="6" fill="#e9ecef" rx="2"/>
  </g>
  
  <!-- Instrucciones -->
  <g transform="translate(0, 240)">
    <text x="300" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#212529">
      Instrucciones Importantes:
    </text>
    
    <g transform="translate(80, 20)">
      <circle cx="0" cy="-3" r="4" fill="#0d6efd"/>
      <text x="15" y="0" font-family="Arial, sans-serif" font-size="14" fill="#495057">
        Debe escanear o fotografiar AMBOS lados del DNI
      </text>
    </g>
    
    <g transform="translate(80, 45)">
      <circle cx="0" cy="-3" r="4" fill="#0d6efd"/>
      <text x="15" y="0" font-family="Arial, sans-serif" font-size="14" fill="#495057">
        Las imágenes deben ser legibles y completas
      </text>
    </g>
    
    <g transform="translate(80, 70)">
      <circle cx="0" cy="-3" r="4" fill="#0d6efd"/>
      <text x="15" y="0" font-family="Arial, sans-serif" font-size="14" fill="#495057">
        Formatos aceptados: JPG, PNG, PDF
      </text>
    </g>
    
    <g transform="translate(80, 95)">
      <circle cx="0" cy="-3" r="4" fill="#0d6efd"/>
      <text x="15" y="0" font-family="Arial, sans-serif" font-size="14" fill="#495057">
        Puede subir ambas caras en un solo archivo PDF o como dos imágenes
      </text>
    </g>
  </g>
</svg>